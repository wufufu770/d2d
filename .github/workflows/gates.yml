name: gates

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  graphd-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Audit Python deps
        run: pip-audit -r requirements.txt
      - name: Secret-leak scan (V-03, hook-proof)
        run: |
          LEAK=$(git ls-files | grep -E '(^cookies.*\.txt$|^quickship.*\.txt$|\.pem$|\.key$|^\.env$|\.host-token|^evidence.*\.md$|^handoff.*\.md$|^tmp-.*\.json$)' || true)
          if [ -n "$LEAK" ]; then echo "❌ 泄露文件入库: $LEAK"; exit 1; fi
          if git grep -qiE 'X-Auth.*[0-9a-f]{32}' -- ':!*.md' ':!docs/*'; then echo "❌ 疑似凭证入库"; exit 1; fi
      - name: "Manifest integrity (V-16: 白名单口径, 排除活跃日志)"
        run: sha256sum -c manifest.sha256 --quiet
      - name: "Card schema gate (T3-1-1: 种子包全量过 Schema, 错字段/缺必填直接挂)"
        run: node scripts/brain/validate-cards.mjs --seed
      - name: Install pytest
        run: python -m pip install pytest==9.1.1
      - run: python -m pytest tests/ -q

  # V-15: CodeQL 默认查询集 (js/py 双语言)
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript, python
      - uses: github/codeql-action/analyze@v4

  # V-15: Semgrep security-audit + secrets 规则集
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v7
      - run: semgrep scan --config p/security-audit --config p/secrets --error

  # V-15: 插件依赖审计 (npm audit)
  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/pentest-dsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # HYG-1: node 20→24 — 仓库 engines(node>=22.5) 下 20 违宪; 24=ci 测试轨同版。
          # dsh-compat 的 22 为最低支持轨(有意, 见其文件头注释)。
          node-version: "24"
      - name: Generate lockfile if absent
        run: npm install --package-lock-only --ignore-scripts
      - name: npm audit (high+ blocks)
        run: npm audit --audit-level=high
      - name: Plugin syntax gates
        run: |
          for f in index.js scheduler.js validator.js sanitize.js adapter-dsh.mjs planner.js report.mjs; do
            node --check "$f"
          done
          bash -n ../../scripts/ops/*.sh
