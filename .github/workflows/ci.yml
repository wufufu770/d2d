name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # node 24：ci 测试轨选择；dsh-compat.yml 保持 node 22 为有意（engines 对齐，见其文件头注释）
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          # HYG-1: python 3.11→3.12 对齐 gates.yml 轨(单一来源); 依赖改 -r requirements.txt
          # (kuzu==0.11.3+pytest==9.1.1 钉版 — 弃"pip install kuzu pytest"未钉形态)
          python-version: '3.12'
      - name: 插件测试(pentest-dsh)
        # XR-P0: 前置根依赖安装 —— xring 测试三级上跳 import scripts/xring/validate.mjs,
        # 其 ajv/ajv-formats 在根 package.json(CI 须先 npm ci 根, 否则 ERR_MODULE_NOT_FOUND)
        # E11b: mocha --exit —— mock server 句柄的非确定性挂源(1.2.0 池)不再阻塞 CI 退出;
        # fail 语义保持(有 failing 仍非零退出)。
        # E13/R-01 摘除 --exit（技术债到期日）: 挂源根因定谳=xring-p1 真子进程弃管
        # （收割笔同批落库, 单文件 3/3+全量多轮 rc=0 验收实录见 docs/devlog.md E13 段）。
        run: npm ci --no-audit --no-fund && cd plugin/pentest-dsh && (npm ci --no-audit --no-fund || npm install --no-audit --no-fund) && npx mocha "test/*.test.mjs"
      - name: 面板测试(d2d-panel)
        run: cd plugin/d2d-panel && (npm ci --no-audit --no-fund || npm install --no-audit --no-fund) && node scripts/build-client.mjs && npm test
      - name: graphd 门禁测试(全目录 tests/ 含 gatewarden/, 基线 406 例)
        run: pip install -r requirements.txt && python -m pytest tests/ -q
      - name: lint
        run: node scripts/lint.mjs
