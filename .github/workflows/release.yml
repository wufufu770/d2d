# release.yml — WRAP-4b 发布相（拍板②④⑤）：tag 触发 OIDC Trusted Publishing
# 零本地 token 纪律：publish 仅凭 GitHub Actions OIDC（id-token: write + npm ≥11.5.1），
# 仓库零 npm token（环境 secret 面空置）；provenance 由 npm --provenance 自动附。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # GitHub Release 创建与资产上传
  id-token: write   # npm OIDC trusted publishing（provenance）

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install full deps (SBOM needs complete lockfile tree)
        working-directory: plugin/pentest-dsh
        run: npm ci

      - name: Generate SBOM (CycloneDX)
        working-directory: plugin/pentest-dsh
        run: npx -y @cyclonedx/cyclonedx-npm --output-file /tmp/sbom.cdx.json

      - name: Publish to npm (OIDC trusted publishing, provenance auto-attached)
        working-directory: plugin/pentest-dsh
        # E11a 批授权改动（dist-tag 策略行——OIDC 认证流零触碰）: 预发布版（semver 含 '-'，
        # 如 v1.1.0-alpha）→ --tag alpha; 正式版走缺省 latest。latest 只随正式 tag 移动。
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-* ]]; then
            npm publish --provenance --access public --tag alpha
          else
            npm publish --provenance --access public
          fi

      - name: GitHub Release (SBOM + report templates + redacted A/B report)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp /tmp/sbom.cdx.json ./sbom.cdx.json
          NOTES=".github/release-notes-${TAG}.md"
          ASSETS=(sbom.cdx.json docs/report-templates/butian.sample.json docs/report-templates/vulbox.sample.json docs/report-templates/edu-src.sample.json experiments/results/ab-report-20260928-190531.md)
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" --title "d2d ${TAG}" --notes-file "$NOTES" "${ASSETS[@]}"
          else
            gh release create "$TAG" --generate-notes "${ASSETS[@]}"
          fi
          rm -f sbom.cdx.json
