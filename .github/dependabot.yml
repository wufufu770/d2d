version: 2
updates:
  # npm 版本更新在 pnpm workspace + 无 lockfile 下不产生 PR(依赖清单由 pnpm 管理);
  # 提交 pnpm-lock.yaml 后此段自动生效, 届时可移除本注释
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
